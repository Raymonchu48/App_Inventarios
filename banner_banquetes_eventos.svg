<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%"
     viewBox="0 0 1600 96"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16100a"/>
      <stop offset="45%" stop-color="#24170d"/>
      <stop offset="100%" stop-color="#16100a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16100a"/>
      <stop offset="20%" stop-color="#d8b06c"/>
      <stop offset="80%" stop-color="#d8b06c"/>
      <stop offset="100%" stop-color="#16100a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="96" rx="20" fill="url(#bg)"/>
  <rect x="92" y="16" width="1416" height="1.2" rx="1" fill="url(#line)" opacity="0.95"/>
  <rect x="92" y="80" width="1416" height="1.2" rx="1" fill="url(#line)" opacity="0.95"/>
  <polygon points="800,11 806,21 794,21" fill="#d8b06c" opacity="0.85"/>
  <polygon points="800,85 806,75 794,75" fill="#d8b06c" opacity="0.85"/>

  <g opacity="0.42" transform="translate(168,26)" stroke="#d8b06c" fill="none">
    <rect x="-26" y="4" width="52" height="42" rx="5" stroke-width="1.4"/>
    <line x1="-26" y1="16" x2="26" y2="16" stroke-width="1.2"/>
    <line x1="-10" y1="-2" x2="-10" y2="10" stroke-width="2"/>
    <line x1="10" y1="-2" x2="10" y2="10" stroke-width="2"/>
    <circle cx="-8" cy="28" r="3" fill="#d8b06c" opacity="0.6" stroke="none"/>
    <circle cx="4" cy="28" r="3" fill="#d8b06c" opacity="0.35" stroke="none"/>
    <circle cx="16" cy="28" r="3" fill="#d8b06c" opacity="0.6" stroke="none"/>
  </g>

  <g opacity="0.40" transform="translate(1432,26)">
    <rect x="-26" y="2" width="52" height="48" rx="4" fill="none" stroke="#d8b06c" stroke-width="1.4"/>
    <line x1="-14" y1="14" x2="14" y2="14" stroke="#d8b06c" stroke-width="1"/>
    <line x1="-14" y1="24" x2="14" y2="24" stroke="#d8b06c" stroke-width="1"/>
    <line x1="-14" y1="34" x2="8" y2="34" stroke="#d8b06c" stroke-width="1"/>
    <polyline points="11,27 19,32 11,37" fill="none" stroke="#d8b06c" stroke-width="1.4"/>
  </g>

  <circle cx="118" cy="48" r="4" fill="#d8b06c" opacity="0.22"/>
  <circle cx="1482" cy="48" r="4" fill="#d8b06c" opacity="0.22"/>
  <circle cx="132" cy="48" r="2" fill="#d8b06c" opacity="0.14"/>
  <circle cx="1468" cy="48" r="2" fill="#d8b06c" opacity="0.14"/>

  <text x="800" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="400" letter-spacing="5" fill="#d8b06c" opacity="0.74">✦ OPERATIVA PREMIUM ✦</text>
  <text x="800" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="1.2" fill="#f0e1c7" filter="url(#softGlow)">Banquetes y Eventos</text>
  <text x="800" y="73" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="400" letter-spacing="4" fill="#d8b06c" opacity="0.88">Salones · Montajes · Timing · Coordinación</text>
